<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4fb">
<title>My Pink Habits</title>
<style>
:root{--ink:#302735;--muted:#a99daa;--pink:#e8b8df;--pink2:#f9e5f4;--lilac:#eee4fb;--mint:#dcf5ed;--peach:#ffead5;--yellow:#fff2a6;--blue:#e0edff;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:#fffafd;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;min-height:100vh;margin:auto;background:#fffafd;padding-bottom:100px}
header{background:linear-gradient(150deg,#f6eafa,#fff0f8);border-radius:0 0 34px 34px;padding:22px 22px 25px;position:sticky;top:0;z-index:2}
.top{display:flex;align-items:center;justify-content:space-between}.menu{font-size:27px;border:0;background:none;color:var(--ink)}h1{font-size:25px;margin:0;font-weight:800}.streak{background:#fff;border-radius:30px;padding:9px 15px;font-weight:700;color:#9e78a5}
.sub{font-size:12px;color:#9d8da0;margin:18px 0 12px;text-align:center;letter-spacing:.3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{border:0;background:transparent;color:#a99eae;padding:7px 0;border-radius:30px;font-size:13px}.day strong{display:grid;place-items:center;margin:9px auto 0;width:42px;height:42px;border:1.5px solid #e8dced;border-radius:50%;font-size:16px;color:#a99eae}.day.active{background:#e6c8f3;color:#3b2b43;font-weight:700}.day.active strong{background:#fff;border-color:#fff;color:#302735}
main{padding:20px 18px}.summary{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #f4e8f1;border-radius:22px;padding:15px 17px;margin-bottom:17px;box-shadow:0 5px 18px #ead9e51c}.summary small{color:#9e91a0}.progress{font-size:22px;font-weight:800;color:#b36db2}.bar{height:7px;background:#f3e8f1;border-radius:10px;margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#e9b9df,#bda5ef);width:0%;border-radius:10px}
.task{border-radius:25px;padding:18px 16px;display:flex;align-items:center;gap:14px;margin:14px 0;min-height:104px;transition:.2s}.task:nth-of-type(2){background:var(--peach)}.task:nth-of-type(3){background:#d5f5ee}.task:nth-of-type(4){background:#fff18d}.task:nth-of-type(5){background:#ffe5d0}.task:nth-of-type(6){background:#dceaff}.task:nth-of-type(7){background:#e7dcfa}.task:nth-of-type(8){background:#f9e2ee}
.emoji{font-size:39px;width:56px;text-align:center}.tasktext{flex:1;min-width:0}.when{font-size:12px;color:#665c68;margin-bottom:6px}.taskname{font-size:18px;font-weight:750;line-height:1.2;overflow-wrap:anywhere}.check{appearance:none;width:29px;height:29px;border:2px solid #a99b91;border-radius:50%;background:#ffffff30;flex-shrink:0;position:relative}.check:checked{background:#c57fc2;border-color:#c57fc2}.check:checked:after{content:"✓";position:absolute;color:#fff;font-weight:800;left:7px;top:2px;font-size:17px}.done{opacity:.63}.done .taskname{text-decoration:line-through}
.add{position:fixed;right:max(24px,calc((100vw - 520px)/2 + 24px));bottom:93px;width:64px;height:64px;border:0;border-radius:50%;background:#9450e8;color:#fff;font-size:38px;box-shadow:0 8px 25px #9450e855;z-index:3}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:#fff;border-top:1px solid #f0e8f0;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:4}
nav button{border:0;background:none;color:#b9b1bd;font-size:11px;padding:4px 0}nav button span{display:block;font-size:23px;margin-bottom:3px}nav button.active{color:#a64eaa;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:#34283c66;z-index:10;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fffafd;width:min(100%,520px);border-radius:25px 25px 0 0;padding:23px 20px 35px}.sheet h2{margin:0 0 15px}.sheet input,.sheet select{width:100%;padding:14px;border:1px solid #eadbea;border-radius:13px;background:#fff;margin:7px 0;font:inherit;color:var(--ink)}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;padding:13px;border:0;border-radius:14px;font-weight:700;background:#f2e2f4;color:#573b5b}.actions button.primary{background:#b86cb4;color:#fff}
.toast{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:#443449;color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;display:none;z-index:20}
@media(min-width:600px){body{padding:20px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 10px 45px #d8c5d833}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="top"><button class="menu" aria-label="Menu" onclick="showToast('My Pink Habits 💗')">☰</button><h1 id="dateTitle">Today</h1><div class="streak">💧 <b id="count">0</b></div></div>
 <div class="sub">YOUR LITTLE STEPS, YOUR LOVELY ROUTINE</div>
 <div class="week" id="week"></div>
</header>
<main>
 <div class="summary"><div style="flex:1"><small>Progress hari ini</small><div class="bar"><span id="bar"></span></div></div><div class="progress" id="progress" style="margin-left:16px">0%</div></div>
 <div id="tasks"></div>
</main>
<button class="add" onclick="openModal()" aria-label="Tambah aktivitas">＋</button>
<nav>
 <button class="active" onclick="tab('Routine',this)"><span>☑</span>Routine</button>
 <button onclick="tab('Inspire',this)"><span>☷</span>Inspire</button>
 <button onclick="tab('Wheel',this)"><span>🎡</span>Wheel</button>
 <button onclick="tab('Tools',this)"><span>🔨</span>Tools</button>
 <button onclick="tab('Profile',this)"><span>☺</span>Profile</button>
</nav>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
 <h2>Tambah rutinitas 🌷</h2>
 <input id="newName" placeholder="Nama aktivitas, misalnya: Minum air putih">
 <input id="newEmoji" placeholder="Emoji (contoh: 💗)" maxlength="4">
 <select id="newTime"><option>Anytime</option><option>Pagi</option><option>Siang</option><option>Sore</option><option>Malam</option></select>
 <div class="actions"><button onclick="closeModal()">Batal</button><button class="primary" onclick="addTask()">Simpan</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const defaults=[
 {name:"Sarapan",emoji:"🍓",time:"Anytime"},
 {name:"Jemur Baju Pagi",emoji:"🌷",time:"Anytime"},
 {name:"Hidupkan Sanyo",emoji:"🪴",time:"Anytime"},
 {name:"Rapikan Kasur",emoji:"🌺",time:"Anytime"},
 {name:"Diner : Telur Kecap, Sayur",emoji:"🍲",time:"Anytime"},
 {name:"Baca Al-Qur'an",emoji:"📖",time:"Anytime"},
 {name:"Skincare malam",emoji:"🧴",time:"Malam"}
];
let tasks=JSON.parse(localStorage.getItem('mph_tasks')||'null')||defaults;
let selected=new Date();let checks=JSON.parse(localStorage.getItem('mph_checks')||'{}');
const key=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function save(){localStorage.setItem('mph_tasks',JSON.stringify(tasks));localStorage.setItem('mph_checks',JSON.stringify(checks))}
function renderWeek(){
 const el=document.getElementById('week');el.innerHTML='';
 const start=new Date(selected);let day=start.getDay();start.setDate(start.getDate()-((day+6)%7));
 const names=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
 for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let b=document.createElement('button');b.className='day'+(key(d)===key(selected)?' active':'');b.innerHTML=`${names[d.getDay()]}<strong>${d.getDate()}</strong>`;b.onclick=()=>{selected=d;render()};el.appendChild(b)}
 document.getElementById('dateTitle').textContent=key(selected)===key(new Date())?'Today':selected.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}
function render(){
 renderWeek();let done=checks[key(selected)]||[];let box=document.getElementById('tasks');box.innerHTML='';
 tasks.forEach((t,i)=>{let div=document.createElement('div');div.className='task'+(done.includes(i)?' done':'');
 div.innerHTML=`<div class="emoji">${escapeHtml(t.emoji)}</div><div class="tasktext"><div class="when">${escapeHtml(t.time)}</div><div class="taskname">${escapeHtml(t.name)}</div></div><input class="check" type="checkbox" ${done.includes(i)?'checked':''} aria-label="Selesaikan ${escapeHtml(t.name)}">`;
 div.querySelector('input').onchange=e=>{let a=checks[key(selected)]||[];checks[key(selected)]=e.target.checked?[...a,i]:a.filter(x=>x!==i);save();render()};box.appendChild(div)});
 let n=done.length,p=tasks.length?Math.round(n/tasks.length*100):0;document.getElementById('progress').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.getElementById('count').textContent=n;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('newName').focus()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addTask(){let name=document.getElementById('newName').value.trim();if(!name){showToast('Tulis nama aktivitas dulu ya 💗');return}tasks.push({name,emoji:document.getElementById('newEmoji').value.trim()||'💗',time:document.getElementById('newTime').value});save();closeModal();document.getElementById('newName').value='';document.getElementById('newEmoji').value='';render();showToast('Rutinitas berhasil ditambahkan 🌷')}
function showToast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1900)}
function tab(name,el){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(name==='Routine'){showToast('Ini halaman rutinitasmu 💗')}else if(name==='Wheel'){showToast('Fitur Wheel akan kita buat berikutnya 🎡')}else showToast('Halaman '+name+' akan kita lengkapi berikutnya ✨')}
render();
</script>
</body>
</html>
